name: Media sync

on:
  schedule:
    # Every 3 hours. Also keeps the repo "active" so GitHub does not disable
    # scheduled workflows on public repos after 60 days of quiet.
    - cron: "23 */3 * * *"
  workflow_dispatch:

# The manifest is committed back after each run, so runs must not overlap.
concurrency:
  group: media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write   # so a run can re-trigger itself while a backlog remains

    steps:
      - uses: actions/checkout@v4
        with:
          # The branch HEAD at the moment this step runs, NOT the commit that existed when
          # the run was queued. Runs now last hours, longer than the 3h cron, so a run can
          # sit queued behind an earlier one; checking out its stale creation-time commit
          # would hand it an OLD manifest and make it re-upload everything the earlier run
          # just archived.
          ref: main

      - name: Free up runner disk
        # A default runner has ~14 GB free; VODs are routinely bigger than that.
        # Dropping the preinstalled toolchains gets it to roughly 40 GB.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        # NOT preinstalled on GitHub's ubuntu runners (the 2026-09 run logs never mention
        # it). Without it, time-sliced downloads - the only way to fit a 10h+ VOD on a
        # ~36 GB runner - cannot run, and yt-dlp merely WARNS (hidden by --no-warnings)
        # that it skipped its container fix-up. ffprobe (same package) is used to reject
        # truncated or empty downloads before they are uploaded.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Sync
        id: archive
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHANNEL: ${{ secrets.TWITCH_CHANNEL }}
          ARCHIVE_SALT: ${{ secrets.ARCHIVE_SALT }}
          SKIP_VODS: ${{ secrets.SKIP_VODS }}
          SKIP_TITLE_RE: ${{ secrets.SKIP_TITLE_RE }}
          MAX_VODS_PER_DAY: "2"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NOTIFY_WORKER_URL: ${{ secrets.NOTIFY_WORKER_URL }}
          NOTIFY_WEBHOOK_TOKEN: ${{ secrets.NOTIFY_WEBHOOK_TOKEN }}
          ARCHIVE_LANE: ${{ secrets.ARCHIVE_LANE }}
        run: python sync.py

      - name: Commit state
        # Runs even if the archive step died partway, so completed uploads are
        # never re-downloaded on the next run.
        if: always()
        run: |
          git config user.name "media-sync-bot"
          git config user.email "media-sync-bot@users.noreply.github.com"
          if ! git diff --quiet state.json; then
            git add state.json
            git commit -m "state update"
            # sync.py already checkpoints after every upload; this is the fallback.
            # Rebase first: a push from anyone else during a multi-hour run would
            # otherwise be rejected, and that run's uploads forgotten and repeated.
            git pull --rebase -q origin main
            git push
          else
            echo "state unchanged"
          fi

      - name: Continue if a backlog remains
        # Only re-triggers when this run actually archived something, so a
        # persistent failure stops the chain rather than looping forever.
        # This makes the backlog drain without depending on the cron firing.
        if: steps.archive.outputs.continue == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Archived ${{ steps.archive.outputs.archived }} this run, ${{ steps.archive.outputs.remaining }} still to go - starting another."
          gh workflow run sync.yml --repo "$GITHUB_REPOSITORY"
